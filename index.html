<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Theia · NASA Space Apps Challenge 2026</title>
<meta name="description" content="Theia checks your posture with a phone camera, compares it with your own normal, and tells you whether a change is expected.">
<link href="https://cdn.jsdelivr.net/npm/computer-modern@0.1.2/cmu-serif.css" rel="stylesheet">
<style>
:root{--ink:oklch(0.18 0 0);--muted:oklch(0.45 0 0);--acc:oklch(0.52 0.17 30);--bg:oklch(0.995 0 0)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:500 19px/1.5 'CMU Serif','Latin Modern Roman',Georgia,serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
.page{max-width:1040px;margin:0 auto;padding:40px 24px 80px}
a{color:inherit;text-decoration-thickness:1px;text-underline-offset:.15em}
a:hover{color:var(--acc)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
p{margin:0}
.sc{font-variant:small-caps;letter-spacing:.06em;text-transform:lowercase}
.mast{text-align:center}
.mast .name{font:500 clamp(56px,9vw,104px)/1 'CMU Serif',Georgia,serif;letter-spacing:-.01em}
.mast .dl{display:flex;justify-content:space-between;gap:8px 20px;flex-wrap:wrap;margin-top:18px;padding:8px 0;border-top:1px solid var(--ink);border-bottom:3px double var(--ink);font-size:16px;font-weight:700}
@media (max-width:700px){.mast .dl{flex-direction:column;align-items:center;gap:2px}}
.head{text-align:center;padding:48px 0 44px}
.head h1{font-weight:500;font-size:clamp(34px,5vw,58px);line-height:1.1;max-width:18ch;margin:0 auto;letter-spacing:0;text-wrap:balance}
.head .sub{max-width:46ch;margin:18px auto 0;font-size:20px;color:var(--muted);text-wrap:pretty}
.links{display:flex;justify-content:center;gap:10px 22px;flex-wrap:wrap;margin-top:22px;font-size:17px}
</style>
</head>
<body>
<div class="page">
 <header class="mast">
  <div class="name">Theia</div>
  <div class="dl sc"><span>Vienna</span><span>NASA Space Apps Challenge</span><span>14–15 November 2026</span></div>
 </header>
 <main class="head">
  <h1>Is my body recovering normally?</h1>
  <p class="sub">Theia checks your posture with a phone camera, compares it with your own normal, and tells you whether a change is expected.</p>
  <p class="links"><a href="#">Paper (PDF, 15 Nov)</a><a href="#">Slides</a><a href="#">Code</a></p>
 </main>
</div>
</body>
</html>
